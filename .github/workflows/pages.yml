name: Deploy Site

on:
  push:
    branches:
      - master
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  verify-translation-env:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - name: Check published environment
        shell: bash
        run: |
          lock_file=$(python scripts/translation-env/verify_manifest.py --print-lock-path | tail -1)
          uv venv .scaffold/translation-venv --python 3.12
          uv pip sync "$lock_file" --python .scaffold/translation-venv --only-binary :all:
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_bin=.scaffold/translation-venv/Scripts/python.exe
            engine_bin=.scaffold/translation-venv/Scripts/pdf2zh_next.exe
          else
            python_bin=.scaffold/translation-venv/bin/python
            engine_bin=.scaffold/translation-venv/bin/pdf2zh_next
          fi
          "$python_bin" -c "from pdf2zh_next.main import cli"
          "$engine_bin" --help >/dev/null

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [build, verify-translation-env]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
